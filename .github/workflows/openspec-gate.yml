# .github/workflows/openspec-gate.yml
#
# The agent-agnostic enforcement floor in CI (spec §18): every active change must
# pass `openspec validate --all` before code merges. This is the one surface no
# local configuration can bypass — a developer can pass --no-verify to the
# pre-commit hook, and a PreToolUse hook cannot gate the session that installed
# it.
#
# It used to say "and carry >= 2 independent reviewers", which was true of gate
# 1.3.1 and is not true of the 2.0.0 this host resolves from the pin. Reviews are
# now REPORTED and never enforced — see the final step for what that changes
# about reading a green run.
#
# Adapted from the core reference workflow
# (agenticapps-workflow-core reference-implementations/openspec-change-gate/hooks/).
# Host-local adaptations: action versions pinned to @v4 (this repo's convention),
# and OPENSPEC_GATE_SELF=opencode in the job env so this host's own reviews are
# excluded from the reviewer count. Scoring the gate with that variable ambient
# was verified harmless here — 71/71 either way, because no harness fixture names
# `opencode` as a reviewer — unlike codex-workflow, which must `env -u` it.
name: OpenSpec change gate
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_GATE_SELF: opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec
      - name: Materialise core artifacts from the pin
        # Since ADR-0013 this host pins the gate and the wrapper in
        # tools/core-vendor.manifest rather than vendoring them, so a fresh
        # checkout has neither. Resolve both here, once, and every step below
        # scores and runs exactly what install.sh would publish.
        #
        # --check afterwards proves the bytes are there before anything tries to
        # score them. It is CI's own guard, independent of the harness: the two
        # assertions fail for different reasons and neither implies the other.
        run: |
          set -euo pipefail
          bash bin/materialise-core-artifacts.sh
          bash bin/materialise-core-artifacts.sh --check
      - name: Prove the gate itself is conformant
        # A gate that has drifted can pass every repo it guards while enforcing
        # nothing (issue #32: five copies, none conformant). Score it before
        # trusting its verdict.
        #
        # The gate is RESOLVED from the pin; the harness scoring it is VENDORED
        # from the same pinned commit. That pairing is the point — a stale
        # harness certifies a stale gate, so both move together when
        # core_commit advances, rather than in two independent re-vendor PRs.
        run: bash tools/change-gate-conformance.sh bin/openspec-change-gate.sh
      - name: Prove the reviewer-cli is conformant
        # The §18 review *producer* wrapper deserves the same bar as the gate it
        # feeds (core#41: a silently-vendored copy lost a vendor arm and reported
        # nothing). Same pairing as above: resolved wrapper, harness vendored at
        # the same commit.
        run: bash tools/reviewer-cli-conformance.sh bin/reviewer-cli.sh
      - name: Run the change gate
        run: bash bin/openspec-change-gate.sh --ci
        # exit 0 = every active change passes `openspec validate --all`;
        # exit 1 = block the PR.
        #
        # Under gate 2.0.0 REVIEWS DO NOT BLOCK. Missing, stale and objecting
        # review evidence are REPORTED in this log and never enforced; the only
        # blocking clauses left are a failing validate and a missing openspec
        # CLI, both errors in the change itself. Before the pin advanced to core
        # ef030d0 this host ran 1.3.1, where an unreviewed change failed the
        # build — so read a green gate step as "the change is well-formed", not
        # as "the change was reviewed".
